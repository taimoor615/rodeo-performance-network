name: Build & Deploy to Hostinger

on:
  push:
    branches:
      - main        # Sirf main branch push par deploy hoga

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Code checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node.js setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Dependencies install
      - name: Install dependencies
        run: npm ci

      # 4. Build
      - name: Build project
        run: npm run build
        env:
          VITE_WORDPRESS_URL: ${{ secrets.VITE_WORDPRESS_URL }}

      # 5. Deploy dist/ to Hostinger via FTP
      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /domains/rinrodeo.com/public_html/
          exclude: |
            **/wp/**
            **/.htaccess
            **/wp-content/**
          dangerous-clean-slate: false
